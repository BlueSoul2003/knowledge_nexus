<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Module | Knowledge Nexus</title>
  
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌌</text></svg>'>
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Upload Studio specific styles */
    .studio-container {
      max-width: 800px;
      margin: 6rem auto 4rem;
      padding: 3rem;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
    }
    
    .studio-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .studio-header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .studio-header p {
      color: var(--text-muted);
    }

    .upload-zone {
      border: 2px dashed #3f3f46;
      border-radius: 12px;
      padding: 4rem 2rem;
      text-align: center;
      transition: all var(--transition-fast);
      cursor: pointer;
      background: rgba(39, 39, 42, 0.3);
      margin-bottom: 2rem;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent-color);
      background: rgba(37, 99, 235, 0.1);
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      color: var(--accent-color);
      margin-bottom: 1rem;
    }

    .file-input {
      display: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-control {
      background: #09090b;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.8rem 1rem;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 1rem;
      transition: border-color var(--transition-fast);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-color);
    }

    .status-panel {
      display: none;
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius-md);
      color: #34d399;
      text-align: center;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 50%;
      border-top-color: var(--accent-color);
      animation: spin 1s ease-in-out infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      Knowledge Nexus
    </a>
  </nav>

  <main>
    <div class="studio-container animate-fade-in">
      <div class="studio-header">
        <h1>Module Studio</h1>
        <p>Contribute to the open sandbox. Upload your simulation, article, or video.</p>
      </div>

      <div class="upload-zone" id="dropZone">
        <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <h3 style="margin-bottom: 0.5rem;">Drag & Drop your file here</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Supports .html (zip), .md, .mp4, .mp3</p>
        <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">Browse Files</button>
        <input type="file" id="fileInput" class="file-input">
        <div id="fileDisplay" style="margin-top: 1rem; color: #60a5fa; font-weight: bold; display: none;"></div>
      </div>

      <form id="uploadForm">
        <div class="form-grid">
          <div class="form-group full-width">
            <label class="form-label">Module Title</label>
            <input type="text" class="form-control" placeholder="e.g., Quantum Tunneling Simulator" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Author Name / Handle</label>
            <input type="text" class="form-control" placeholder="e.g., Ada Lovelace" required>
          </div>

          <div class="form-group">
            <label class="form-label">Content Type</label>
            <select class="form-control" required>
              <option value="html">Interactive Web Template (HTML/JS)</option>
              <option value="markdown">Markdown Article (.md)</option>
              <option value="video">Video Recording (.mp4)</option>
              <option value="audio">Audio Podcast (.mp3)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Category</label>
            <select class="form-control" required>
              <option value="physics">Physics</option>
              <option value="economics">Economics</option>
              <option value="psychology">Psychology</option>
              <option value="tech">Tech / Hardware</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Recommended For</label>
            <select class="form-control" required>
              <option value="student">Student / Learner</option>
              <option value="researcher">Academic / Researcher</option>
              <option value="developer">Developer</option>
              <option value="hobbyist">General Hobbyist</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label class="form-label">Short Description</label>
            <textarea class="form-control" rows="3" placeholder="Briefly describe what this module teaches..." required></textarea>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 1rem; font-size: 1.1rem;" id="submitBtn">
          Submit to Web Database
        </button>
      </form>

      <div id="statusPanel" class="status-panel">
        <div id="statusText"><span class="loading-spinner"></span> Connecting to Supabase Upload Bucket...</div>
      </div>
    </div>
  </main>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileDisplay = document.getElementById('fileDisplay');
    const uploadForm = document.getElementById('uploadForm');
    const statusPanel = document.getElementById('statusPanel');
    const statusText = document.getElementById('statusText');
    const submitBtn = document.getElementById('submitBtn');

    // Drag and Drop Logic
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
    });

    dropZone.addEventListener('drop', (e) => {
      let dt = e.dataTransfer;
      let files = dt.files;
      if (files.length) handleFiles(files);
    });

    fileInput.addEventListener('change', function() {
      if (this.files.length) handleFiles(this.files);
    });

    function handleFiles(files) {
      fileDisplay.textContent = `Selected File: ${files[0].name}`;
      fileDisplay.style.display = 'block';
    }

    // Mock Upload Logic
    uploadForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if (!fileDisplay.textContent) {
        alert("Please upload a file first.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.5';
      statusPanel.style.display = 'block';
      statusPanel.style.borderColor = 'rgba(59, 130, 246, 0.3)';
      statusPanel.style.background = 'rgba(59, 130, 246, 0.1)';
      statusPanel.style.color = '#60a5fa';
      statusText.innerHTML = '<span class="loading-spinner"></span> Processing and compressing...';

      // Mock sequence of upload states
      setTimeout(() => {
        statusText.innerHTML = '<span class="loading-spinner"></span> Creating Supabase database record...';
      }, 1500);

      setTimeout(() => {
        statusText.innerHTML = '<span class="loading-spinner"></span> Uploading asset to Cloud Storage blob...';
      }, 3000);

      setTimeout(() => {
        statusPanel.style.borderColor = 'rgba(16, 185, 129, 0.3)';
        statusPanel.style.background = 'rgba(16, 185, 129, 0.1)';
        statusPanel.style.color = '#34d399';
        statusText.innerHTML = '✨ Success! Module submitted successfully for review and inserted into `pending_modules`.';
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        uploadForm.reset();
        fileDisplay.style.display = 'none';
        fileDisplay.textContent = '';
      }, 4500);
    });
  </script>
</body>
</html>
