<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Nexus - Media Player</title>
  
  <!-- Add simple SVG favicon -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌌</text></svg>'>
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    nav {
      width: 100%;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 1.25rem;
      color: #fff;
      text-decoration: none;
    }
    
    .player-container {
      width: 100%;
      max-width: 1000px;
      margin: 4rem auto;
      padding: 2rem;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.05);
      text-align: center;
    }

    video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    audio {
      width: 100%;
      margin-top: 2rem;
    }

    .audio-visual-placeholder {
      width: 100%;
      height: 300px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 1rem;
    }

    .audio-icon {
      width: 64px;
      height: 64px;
      color: var(--accent);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    #error {
      color: #ef4444;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <nav>
    <a href="../index.html" class="nav-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      Knowledge Nexus
    </a>
  </nav>

  <div class="player-container" id="playerWrap">
    <!-- Injected dynamically -->
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const filePath = urlParams.get('file');
      const fileType = urlParams.get('type');
      const playerWrap = document.getElementById('playerWrap');

      if (!filePath) {
        playerWrap.innerHTML = '<p id="error">Error: No media file specified.</p>';
        return;
      }

      // Check if URL is absolute (like a YouTube or external MP4 link)
      const isAbsolute = /^https?:\/\//i.test(filePath);
      const mediaSource = isAbsolute ? filePath : `../${filePath}`;

      if (fileType === 'video') {
        playerWrap.innerHTML = `
          <video controls autoplay name="media">
            <source src="${mediaSource}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        `;
      } else if (fileType === 'audio') {
        playerWrap.innerHTML = `
          <div class="audio-visual-placeholder">
            <svg class="audio-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
          </div>
          <audio controls autoplay name="media">
            <source src="${mediaSource}" type="audio/mpeg">
            Your browser does not support the audio element.
          </audio>
        `;
      } else {
        playerWrap.innerHTML = '<p id="error">Error: Invalid media type specified.</p>';
      }
    });
  </script>
</body>
</html>
