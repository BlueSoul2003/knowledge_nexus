<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Module Title | Knowledge Nexus</title>
  
  <!-- Link to the shared Knowledge Nexus module styling -->
  <!-- Adjust the relative path depending on how deep your folder is -->
  <link rel="stylesheet" href="../../css/module-shared.css">
  
  <style>
    /* Add your custom styles here */
    .simulation-area {
      width: 100%;
      height: 400px;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <!-- Back button to return to the main nexus -->
  <a href="../../index.html" style="color: var(--text-muted); text-decoration: none; margin-bottom: 1rem; display: inline-block;">&larr; Back to Nexus</a>

  <div class="module-container">
    <h1>Your Module Title</h1>
    <p>A brief description of what this module demonstrates or simulates.</p>
    
    <!-- Your Interactive Content Goes Here -->
    <div class="simulation-area">
      <p style="color: var(--text-muted);">[ Interactive Canvas / Simulation Area ]</p>
    </div>

    <!-- Controls / UI -->
    <div class="controls">
      <button class="btn" id="startBtn">Start Action</button>
      <button class="btn" id="resetBtn" style="background-color: var(--card-border); color: var(--text-main);">Reset</button>
    </div>
  </div>

  <script>
    // Your JavaScript Logic here
    document.getElementById('startBtn').addEventListener('click', () => {
      console.log("Simulation Started!");
      alert("Action triggered! Build your logic here.");
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      console.log("Simulation Reset!");
    });
  </script>
</body>
</html>
