<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Nexus - Article Viewer</title>
  
  <!-- Add simple SVG favicon -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌌</text></svg>'>
  
  <!-- GitHub Markdown CSS for clean styling -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    nav {
      width: 100%;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 1.25rem;
      color: #fff;
      text-decoration: none;
    }
    
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 800px;
      width: 100%;
      margin: 2rem auto;
      padding: 3rem;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    /* Dark mode overrides for github-markdown-css */
    .markdown-body {
      color: var(--text-main);
    }
    
    #loading {
      margin-top: 5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 767px) {
      .markdown-body {
        padding: 1.5rem;
        margin: 1rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="../index.html" class="nav-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      Knowledge Nexus
    </a>
  </nav>

  <div id="loading">
    <div class="spinner"></div>
    <p>Loading Manuscript...</p>
  </div>

  <article id="content" class="markdown-body" style="display: none;"></article>

  <!-- Marked Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const filePath = urlParams.get('file');

      if (!filePath) {
        document.getElementById('loading').innerHTML = '<p style="color: #ef4444;">Error: No file specified.</p>';
        return;
      }

      try {
        // Adjust relative path since template is inside /templates
        // Assuming file from modules.json is relative to the knowledge-nexus root.
        const res = await fetch(`../${filePath}`); 
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        
        const markdownText = await res.text();
        const htmlContent = marked.parse(markdownText);
        
        const contentEl = document.getElementById('content');
        contentEl.innerHTML = htmlContent;
        contentEl.style.display = 'block';
        document.getElementById('loading').style.display = 'none';
        
      } catch (error) {
        document.getElementById('loading').innerHTML = `<p style="color: #ef4444;">Failed to load article. <br><span style="font-size:0.8rem">${error.message}</span></p>`;
      }
    });
  </script>
</body>
</html>
