<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Nexus | 個人知識庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white flex flex-col min-h-screen">

    <!-- 導航欄 -->
    <nav class="fixed w-full z-50 glass-card border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-2 cursor-pointer">
                    <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    <span class="font-bold text-xl tracking-tight hidden sm:block">回到首頁</span>
                </a>
                
                <div class="flex items-center gap-4">
                    <span class="text-sm font-medium text-slate-400" id="dash-user-email">載入中...</span>
                    <!-- 登出按鈕透過 auth_manager.js 處理 -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 pt-24 pb-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        <div class="mb-8 border-b border-slate-800 pb-6 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold mb-2">個人知識庫 (Dashboard)</h1>
                <p class="text-slate-400 text-sm">在這裡上傳你的 CSV 物理數據、互動模組與簡報，並產生分享連結。</p>
            </div>
            <!-- 指向 Leaderboard 等 Gamification -->
            <div class="text-right">
                <div class="text-sm text-slate-400 mb-1">社群貢獻度 (EXP)</div>
                <div class="text-2xl font-bold text-emerald-400" id="user-exp">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Upload Section -->
            <div class="lg:col-span-1">
                <div class="glass-card rounded-2xl p-6 border border-slate-700">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        上傳檔案
                    </h2>
                    
                    <form id="upload-form" class="space-y-4">
                        <div class="border-2 border-dashed border-slate-700 rounded-xl p-6 text-center hover:border-blue-500 transition-colors">
                            <input type="file" id="file-input" class="hidden" accept=".csv,.json,.html,.md,.docx,.pptx">
                            <label for="file-input" class="cursor-pointer">
                                <svg class="w-10 h-10 text-slate-500 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                <span class="text-sm font-medium text-blue-400 block mb-1">點擊選擇檔案</span>
                                <span class="text-xs text-slate-500">支援 CSV, HTML, JSON, MD, Docx, PPTX</span>
                            </label>
                            <div id="file-selected-name" class="mt-2 text-xs font-semibold text-emerald-400 truncate hidden"></div>
                        </div>
                        
                        <button type="submit" id="upload-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                            開始上傳
                        </button>
                    </form>
                </div>
            </div>

            <!-- File List Section -->
            <div class="lg:col-span-2">
                <div class="glass-card rounded-2xl p-6 border border-slate-700 h-full">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold">我的檔案庫</h2>
                        <button onclick="fileManager.fetchMyFiles()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition-colors" title="重新整理">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>

                    <div id="file-list-container" class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                        <!-- Loading State -->
                        <div class="text-center py-10 text-slate-500">
                            <svg class="animate-spin w-8 h-8 mx-auto mb-3 text-blue-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            正在載入檔案...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/supabase_client.js"></script>
    <script type="module" src="js/file_manager.js"></script>
    <script type="module">
        import { supabase } from './js/supabase_client.js';
        
        // Protect Dashboard Route
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (!session) {
                alert('請先回到首頁登入！');
                window.location.href = 'index.html';
            } else {
                document.getElementById('dash-user-email').textContent = session.user.email;
            }
        });

        supabase.auth.onAuthStateChange((event, session) => {
            if (!session) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
